# Make it use C-a, similar to screen..
unbind C-b
unbind l
set -g prefix C-v
bind-key C-v last-window
 
# Reload key
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
 
set -g history-limit 50000

# No 500ms delay after Esc (vim/emacs friendly)
set -sg escape-time 10

# Let apps know when the pane gains/loses focus
set -g focus-events on

# New splits open in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Support mouse tmux <2.1
# set -g mode-mouse on
# set -g mouse-select-pane on
# mouse mode on tmux >2.1
set -g mouse on

# Use vi keys in copy-mode instead of emacs (EDITOR=emacs makes tmux default to emacs keys)
set -g mode-keys vi

# Mouse wheel:
#  - app wants the mouse (mouse_any_flag)  -> pass the event through
#  - already in copy-mode                  -> scroll copy-mode
#  - app on alternate screen (less, agy..) -> send Up/Down arrows (3 lines per tick)
#  - plain shell                           -> enter copy-mode and scroll (auto-exit at bottom with -e)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' \
    \"if -Ft= '#{alternate_on}' 'send-keys -N 3 Up' 'copy-mode -e; send-keys -M'\""
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' \
    \"if -Ft= '#{alternate_on}' 'send-keys -N 3 Down' 'send-keys -M'\""

# Copy/paste with the mouse, no Cmd+R needed.
# Terminal.app has no OSC 52 clipboard support, so pipe the selection to pbcopy.
# Drag-select (or double/triple click) copies to the macOS clipboard; Cmd+V pastes as usual.
set -g copy-command 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

# PageUp/PageDown: in a plain shell enter copy-mode and page up; in alt-screen apps
# (antigravity-cli, vim, less) forward the key to the app.
# NOTE: Terminal.app must be set to *send* these keys, see Settings > Profiles > Keyboard.
bind -n PageUp   if-shell -F "#{alternate_on}" "send-keys PageUp"   "copy-mode -eu"

# THEME
set -g status-bg colour094
set -g status-fg colour194
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=colour181](#S) [#(whoami)@#H]#[default] '
set -g status-right '#[fg=colour136][#(sysctl -n vm.loadavg | awk "{print \$2, \$3, \$4}")]#[default] #[fg=colour104]%H:%M#[default] '

set-window-option -g window-status-current-style fg=colour194
set-window-option -g window-status-style fg=colour215
# set-window-option -g window-status-current-style bg=colour228
# set-window-option -g window-status-style dim
set-option -g pane-active-border-style fg=colour187

# keys
##set-option -g mouse-select-pane on ## dis fucks up clicking things
set-option -g set-titles-string '#H:#S.#I.#P #W #T' # window number,program name,active (or not)
bind b previous-window
bind f next-window

# maximize-restore panes
bind-key z resize-pane -Z

## unbind and put them to better use
unbind p
unbind n
bind-key p select-pane -U
bind-key n select-pane -D
bind-key j select-pane -L
bind-key k select-pane -R

## the last active pane to the current session
bind-key l join-pane -s !
## join pane from session
bind-key a command-prompt -p "join pane from:" "join-pane -s '%%'"
## send pane to existing session
bind-key A command-prompt -p "send-pane to:" "join-pane -t '%%'"
# Send bash command to pane 1
bind-key S command-prompt -p "Send command to pane 1: " "send-keys -t 1 C-z '%%' Enter"
# send window to another session
bind-key u command-prompt -p "send window to another <session>:<number>" "move-window -t '%%'"

## swap panes
bind-key N swap-pane -D
bind-key P swap-pane -U

# detach all other sessions
bind-key O detach-client -a

# set correct term
set -g default-terminal tmux-256color
# Truecolor passthrough for terminals that support it (Terminal.app itself is 256-color only)
set -ga terminal-overrides ',xterm-256color:Tc'

# Tmux resurrect https://github.com/tmux-plugins/tmux-resurrect
run-shell ~/.tmux-resurrect/resurrect.tmux
# Keybinds for tmux-resurrect
# Ctrl-s save
# Ctrl-r restor

# Tmux sidebar https://github.com/tmux-plugins/tmux-sidebar
run-shell ~/.tmux-sidebar/sidebar.tmux
# keybindings for tmux-sidebar
# ctrl + Tab toggle sidebar
# ctrl + backspace toggle sidebar and move cursor to it
